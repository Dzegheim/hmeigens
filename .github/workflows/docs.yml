# Short YAML workflow that builds the GitHub Pages documentation automatically on every push to main that affects the sources.
name: Documentation
# Prevent multiple documentation workflows from running at the same time.
concurrency:
  group: pages
  cancel-in-progress: false
# Run on push to main.
on:
  push:
    branches: [main]
    # Only rebuild the documentation if the actual sources change.
    paths:
      - 'include/**'
      - '!include/hmeigens/detail/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'Doxyfile'
      - '.github/workflows/docs.yml'
      - 'README.md'
  # Add a button to the Actions tab.
  workflow_dispatch:
# Configure permissions.
permissions:
  # Needed to read the repo.
  contents: read
  # Needed to write to Pages.
  pages: write
  # Needed to verify the source of the deployment.
  id-token: write
# Build and deploy the documentation.
jobs:
  build-and-deploy:
    # Any machine would be fine.
    # Here Ubuntu is a safe choice. If this is changed, the commands below need to change as well.
    runs-on: ubuntu-latest
    # Target the Pages to deploy to.
    environment:
      name: github-pages
      # This gets the URL from the "deployment" step below.
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Download the repo.
      - uses: actions/checkout@v7
      # Get Doxygen.
      - name: Install Doxygen
        # Install version 1.18.0, as this version is the one used to build the docs locally as well.
        # Move to the temporary folder so that there are no weird leftovers from the installation in the checkout.
        # This also verifies the build's checksum.
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -O https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  doxygen-1.18.0.linux.bin.tar.gz" | sha256sum --check
          tar -xzf doxygen-1.18.0.linux.bin.tar.gz
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      # Generate the documentation.
      - name: Generate
        run: |
          doxygen --version
          doxygen Doxyfile
      # Send it to Pages.
      # Configure Pages.
      - uses: actions/configure-pages@v6
      # Package and upload the documentation.
      - uses: actions/upload-pages-artifact@v5
        with:
          # Set the path to where Doxygen wrote.
          path: doxygen/html
      # The deployment proper.
      - id: deployment
        uses: actions/deploy-pages@v5

# YAML workflow that builds the codebase and runs the tests on several Linux distros and versions to verify system compatibility.
name: CI-Linux
# Run on push to main.
on:
  push:
    branches: [main]
    # Ignore files that do not affect the behaviour of the code.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Doxyfile'
      - 'LICENSE'
  # Add a button to the Actions tab.
  workflow_dispatch:
jobs:
  # GitHub's default Linux OS is Ubuntu.
  # This tests several versions.
  ubuntu:
    # Combine every OS-compiler pair with every preset.
    # Lists are below.
    name: ${{ matrix.cfg.os }} ${{ matrix.cfg.compiler }} ${{ matrix.preset }}
    runs-on: ${{ matrix.cfg.os }}
    # Set up for the jobs.
    strategy:
      # Prevent a single job failure from killing the entire run.
      fail-fast: false
      # Set up the configurations to be run.
      matrix:
        cfg:
          # Modern versions of Ubuntu with various compilers.
          # Includes one -arm version as well.
          - { os: ubuntu-24.04, compiler: g++-13 }
          - { os: ubuntu-24.04, compiler: g++-14 }
          - { os: ubuntu-24.04, compiler: clang++-17 }
          - { os: ubuntu-24.04, compiler: clang++-18 }
          - { os: ubuntu-26.04, compiler: g++-15 }
          - { os: ubuntu-26.04, compiler: clang++-22 }
          - { os: ubuntu-26.04-arm, compiler: g++-15 }
        # The four meaningful presets.
        preset: [release, debug, release-f, debug-f]
    # Pick a compiler from the list.
    env:
      CXX: ${{ matrix.cfg.compiler }}
    steps:
      # Download the repo.
      - uses: actions/checkout@v4
      # Get information on the used tools to check in case of problems.
      - name: Tool versions
        run: |
          $CXX --version
          cmake --version
          ninja --version
      # Configuration step.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      # Compilation step.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # Testing step.
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
  # Linux distros that are not Ubuntu.
  # GitHub needs to run them in containers.
  linux-other-distros:
    name: ${{ matrix.distro.name }} ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.distro.name }}
    # Set up for the jobs.
    strategy:
      # Prevent a single job failure from killing the entire run.
      fail-fast: false
      # Set up the configurations to be run.
      matrix:
        # Test some widespread and/or useful distros.
        # They all need to be set up properly with install.
        distro:
          # Debian is common enough to warrant testing.
          - { name: 'debian:trixie', install: 'apt-get update && apt-get install -y g++ cmake ninja-build git' }
          # Fedora tends to be on top of the game with GCC versions.
          # It is also widespread enough.
          - { name: 'fedora:44', install: 'dnf install -y gcc-c++ cmake ninja-build git' }
          # Alpine is useful because it has a different C library.
          # It has samurai instead of ninja. Not funny.
          - { name: 'alpine:3.24', install: 'apk add g++ cmake samurai git' }
        # Just two are enough. One release vs one debug and one double vs one float.
        preset: [release, debug-f]
    steps:
      # Install what is needed.
      # Information on the used tools is here, so no need to print it later.
      - name: Install tools
        run: ${{ matrix.distro.install }}
      # Download the repo.
      - uses: actions/checkout@v4
      # Configuration step.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      # Compilation step.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # Testing step.
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
  # Ubuntu 32-bit build.
  ubuntu-32bit:
    # One per preset.
    name: ubuntu-24.04 g++-14 -m32 ${{ matrix.preset }}
    # One Ubuntu version is enough.
    runs-on: ubuntu-24.04
    # Set up for the jobs.
    strategy:
      # Prevent a single job failure from killing the entire run.
      fail-fast: false
      # Set up the configurations to be run.
      matrix:
        # All four presets are needed.
        # In this environment float and double do not behave the same.
        # Neither do debug and release.
        preset: [release, debug, release-f, debug-f]
    env:
      # Choose a compiler.
      CXX: g++-14
      # The 32-bit flag.
      CXXFLAGS: -m32
    steps:
      # These are needed for linking.
      - name: Install 32-bit libraries
        run: sudo apt-get update && sudo apt-get install -y g++-14-multilib
      # Download the repo.
      - uses: actions/checkout@v4
      # Get information on the used tools to check in case of problems.
      - name: Tool versions
        # The last line prints the relevant macros of the compiler to verify they are indeed the 32-bit ones.
        run: |
          $CXX --version
          cmake --version
          ninja --version
          $CXX $CXXFLAGS -x c++ -dM -E - < /dev/null | grep -E '__i386__|__SIZEOF_POINTER__|__FLT_EVAL_METHOD__'
      # Configuration step.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      # Compilation step.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # Testing step.
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
